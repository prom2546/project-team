<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>หน้าต้อนรับ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Sarabun&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kiosk-style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', 'Sarabun', sans-serif;
      overflow: hidden;
      cursor: pointer;
      color: #ffffff;
    }

    body {
      background: linear-gradient(135deg, #0a001f 0%, #1b0044 30%, #2a0066 50%, #3f0088 70%, #5e00b3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 4rem;
      text-align: center;
      max-width: 700px;
      width: 95%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .logo {
      width: 400px;
      max-width: 80%;
      height: auto;
      margin-bottom: 2.5rem;
      filter: drop-shadow(0 0 15px #ff66cc);
    }

    h1 {
      font-size: 4rem;
      color: #e0aaff;
      text-shadow: 0 0 15px #ff66cc;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-size: 2rem;
      color: #80d0ff;
      margin-bottom: 2rem;
    }

    h3 {
      font-size: 1.4rem;
      font-weight: 300;
      color: #e0e0ff;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .slogan {
      margin-top: 2rem;
      font-size: 1.2rem;
      font-style: italic;
      color: #ccccff;
    }

    @media (max-height: 700px) {
      h1 { font-size: 3rem; }
      h2 { font-size: 1.6rem; }
      h3 { font-size: 1rem; }
      .logo { width: 220px; }
      .slogan { font-size: 1rem; }
    }
  </style>
</head>

<body onclick="location.href='menu.html'">

  <div class="overlay">
    <img src="image/black 2.png" alt="FOOTFIT Logo" class="logo">
    <h1>WELCOME</h1>
    <h2>FOOTFIT VENDING MACHINE</h2>
    <h3>"เพราะสุขภาพดี เริ่มจากตัวเรา"</h3>
    <h3>ก้าวให้ไกลเพื่อสุขภาพและชีวิตของลูกหลาน</h3>
    <div class="slogan">แตะเพื่อเริ่มต้น</div>
  </div>

</body>
</html>
