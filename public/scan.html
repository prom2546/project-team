<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สแกนสุขภาพเท้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Sarabun&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kiosk-style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', 'Sarabun', sans-serif;
      overflow: hidden;
      color: #ffffff;
      text-align: center;
    }

    body {
      background: linear-gradient(135deg, #0a001f 0%, #1b0044 30%, #2a0066 50%, #3f0088 70%, #5e00b3 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .gradient-stripes {
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        60deg,
        rgba(255, 0, 255, 0.05),
        rgba(0, 255, 255, 0.05) 10%,
        transparent 20%
      );
      animation: moveGradient 60s linear infinite;
      z-index: 0;
    }

    @keyframes moveGradient {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent url('https://raw.githubusercontent.com/JulianLaval/canvas-particle-network/master/demo/img/stars.png') repeat;
      animation: moveStars 180s linear infinite;
      opacity: 0.25;
      z-index: 1;
    }

    @keyframes moveStars {
      from { background-position: 0 0; }
      to { background-position: 10000px 5000px; }
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 20px;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #e0aaff;
      text-shadow: 0 0 10px #ff66cc;
    }

    p {
      font-size: 1.3rem;
      color: #ccccff;
      margin-bottom: 20px;
    }

    video {
      width: 90%;
      max-width: 800px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-top: 10px;
    }
    .video-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  margin-top: 40px;
}


    .scan-btn {
      margin-top: 30px;
      padding: 15px 40px;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #ff66cc, #9966ff);
      color: white;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .scan-btn:hover {
      transform: translateY(-5px);
      filter: brightness(1.2);
    }

    #resultMessage {
      display: none;
      font-size: 2rem;
      color: #000;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 9999;
    }

    @media (max-width: 768px) {
      video { width: 95%; }
      .scan-btn { width: 90%; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="gradient-stripes"></div>
  <div class="stars"></div>

  <div class="container">
    <h1>เริ่มการสแกนสุขภาพเท้า</h1>
    <p>กรุณากดปุ่มเพื่อเริ่มการสแกนเท้า</p>

    <!-- วิดีโอกับปุ่มอยู่ใน wrapper เดียวกัน -->
    <div class="video-section">
      <video id="video" autoplay></video>
      <button class="scan-btn" onclick="startScan()">เริ่มการสแกน</button>
    </div>
  </div>

  <div id="resultMessage">
    สแกนสำเร็จ! ผลลัพธ์: <span id="scanResult"></span>
  </div>


  <script>
    let videoElement = document.getElementById("video");

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function (stream) {
          videoElement.srcObject = stream;
        })
        .catch(function (err) {
          console.error("ไม่สามารถเปิดกล้อง:", err);
          alert("ไม่สามารถใช้งานกล้องได้");
        });
    }

    function startScan() {
      startCamera();
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        canvas.width = videoElement.videoWidth || 640;
        canvas.height = videoElement.videoHeight || 480;
        const context = canvas.getContext('2d');
        context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/png');

        if (!imageData) {
          alert("ไม่สามารถจับภาพจากกล้องได้");
          return;
        }

        let stream = videoElement.srcObject;
        let tracks = stream.getTracks();
        tracks.forEach(track => track.stop());

        localStorage.setItem("capturedImage", imageData);

        fetch('http://localhost:5001/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData })
        })
        .then(response => response.json())
        .then(data => {
          if (data.label && data.confidence !== undefined) {
            localStorage.setItem("footLabel", data.label);
            localStorage.setItem("footConfidence", data.confidence);
            document.getElementById('resultMessage').style.display = 'block';
            document.getElementById('scanResult').innerText = `${data.label} (${data.confidence.toFixed(2)}%)`;
            setTimeout(() => {
              window.location.href = "foot-analysis.html";
            }, 5000);
          } else {
            alert("❌ ไม่สามารถอ่านผลลัพธ์จากระบบได้");
          }
        })
        .catch(err => {
          console.error("❌ Scan error:", err.message);
          alert("เกิดข้อผิดพลาดระหว่างส่งข้อมูล:\n" + err.message);
        });
      }, 2000);
    }

    window.onload = startCamera;
  </script>
</body>
</html>
