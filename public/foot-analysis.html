<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ผลสแกนเท้า</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f8fc;
      text-align: center;
      padding: 2rem;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    img {
      width: 150px;
    }
    h1 {
      color: #0066cc;
    }
    .desc {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #444;
    }
    button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #00b894;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ผลการวิเคราะห์เท้าของคุณ</h1>
    <img src="images/flat-foot.png" alt="เท้าแบน">
    <div class="desc">
      <strong>ลักษณะ:</strong> เท้าแบน (Flat Foot)<br>
      อุ้งเท้าของคุณแบน ทำให้รับแรงกระแทกไม่ดี<br>
      <br>
      <strong>แนะนำ:</strong> ควรใช้แผ่นรองหรือรองเท้าที่ซัพพอร์ตโค้งเท้า
    </div>
    <button onclick="location.href='index.html'">กลับไปเลือกสินค้า</button>
  </div>
</body>
</html>
