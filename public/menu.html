<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เมนูหลัก - FOOTFIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Sarabun&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', 'Sarabun', sans-serif;
      overflow: hidden;
      color: white;
      cursor: pointer;
    }

    body {
      background: linear-gradient(135deg, #0a001f 0%, #1b0044 30%, #2a0066 50%, #3f0088 70%, #5e00b3 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero {
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 4rem;
      font-weight: bold;
      color: #e0aaff;
      text-shadow: 0 0 15px #ff66cc;
    }

    .hero p {
      font-size: 1.8rem;
      color: #ccccff;
      margin-top: 1rem;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .btn-custom, .btn-secondary-custom {
      font-size: 2.2rem;
      padding: 30px 60px;
      border-radius: 60px;
      border: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #ff66cc, #9966ff);
      color: white;
      min-width: 400px;
    }

    .btn-secondary-custom {
      background: linear-gradient(135deg, #66ccff, #6699ff);
    }

    .btn-custom:hover, .btn-secondary-custom:hover {
      transform: translateY(-5px);
      filter: brightness(1.2);
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.5rem;
      }

      .hero p {
        font-size: 1.2rem;
      }

      .btn-custom, .btn-secondary-custom {
        font-size: 1.2rem;
        min-width: 90vw;
        padding: 20px;
      }

      .row {
        flex-direction: column;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>FOOTFIT MENU</h1>
    <p>กรุณาเลือกเมนูที่คุณต้องการ</p>
  </div>

  <div class="row">
    <button class="btn-custom" onclick="location.href='scan.html'">สแกนสุขภาพเท้า</button>
    <button class="btn-secondary-custom" onclick="location.href='index_backup.html'">เลือกซื้อสินค้า</button>
  </div>

  <script>
    let lastTouchTime = Date.now();
    const touchTimeout = 2000;

    document.body.addEventListener('touchstart', () => lastTouchTime = Date.now());

    setInterval(() => {
      if (Date.now() - lastTouchTime > touchTimeout) {
        window.location.href = 'home.html';
      }
    }, 5000);
  </script>
</body>
</html>
